<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            height: 400px;
            width: 500px;
        }

        .heading {
            color: red;
            font-weight: lighter;
        }

        label {
            display: block;
            font-size: 18px;
        }

        #city {
            height: 60px;
            width: 17rem;
            border-radius: 8px;
            color: blue;
            border: 0;
            font-size: 20px;
            outline: 2px solid blue;
            margin-top: 20px;
        }

        #btn {
            background: red;
            width: 140px;
            height: 60px;
            padding: auto;
            border-radius: 10px;
            border: none;
            color: white;
            margin-left: 10px;
            font-size: 16px;
        }

        #btn:hover {
            background-color: rgb(204, 42, 42);
            cursor: pointer;
        }

        #btn:active {
            transform: scale(0.8);
        }
    </style>
</head>

<body>
    <div class="app">
        <h1 class="heading">Weather App</h1>
        <b><i>Enter any City of your choice and click the button to check its weather along with a description</i></b>
        <input type="text" name="name" id="city" placeholder="Enter a City" required>
        <button id="btn">Check Weather</button>
        <span class="error" aria-live="polite"></span>
        <h2 id="result"></h2>
    </div>
    <script>
        document.getElementById("btn").onclick = function () {
            let city = document.getElementById("city").value;
            let spanerror = document.querySelector(".error");
            spanerror.style.color = "red";
            if (!city) {
                spanerror.textContent = "Please Select a city";
                return;
            } else {
                spanerror.textContent = ""
            }
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=ba9450b09148dc62bf9ac7fa0762a9cb&units=metric`;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("result").innerHTML = `
                     🌡️ Temp : ${data.main.temp}°C <br>
                     🤒 Feels Like : ${data.main.feels_like}°C <br>
                     🌥️ Description : ${data.weather[0].description} <br>
                    `;
                });
        }
    </script>
</body>

</html>
